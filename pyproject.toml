[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-agent"
version = "0.1.0"
description = "diff를 분석해 커밋 메시지를 생성하는 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "gitpython>=3.1",
    "pygithub>=2.3",
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "qdrant-client>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 서버로 띄울 때만 필요하다. CLI만 쓰는 쪽이 FastAPI까지 받을 이유가 없다.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
commit-agent = "commit_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_agent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# 평가 스크립트가 `evaluation/work/` 에 저장소를 클론해 두므로, 수집 범위를
# 정하지 않으면 그쪽의 테스트까지 끌어와 수집 단계에서 실패한다.
testpaths = ["tests"]
