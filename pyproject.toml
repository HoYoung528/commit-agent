[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-agent"
version = "0.1.0"
description = "diff를 분석해 커밋 메시지를 생성하는 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "gitpython>=3.1",
    "pygithub>=2.3",
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
commit-agent = "commit_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_agent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
